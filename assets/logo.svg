<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Küncü logo">
  <defs>
    <linearGradient id="doner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb900"/>
      <stop offset="0.5" stop-color="#e81224"/>
      <stop offset="1" stop-color="#a80d1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e81224" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e81224" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="56" fill="#140d0f"/>
  <circle cx="60" cy="60" r="56" fill="url(#glow)"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#e81224" stroke-width="3"/>

  <!-- döner kulesi -->
  <path d="M60 24
           c 12 0, 20 6, 20 14
           c 0 6, -4 9, -4 16
           c 0 8, 6 12, 6 22
           c 0 10, -10 14, -22 14
           c -12 0, -22 -4, -22 -14
           c 0 -10, 6 -14, 6 -22
           c 0 -7, -4 -10, -4 -16
           c 0 -8, 8 -14, 20 -14 z"
        fill="url(#doner)"/>

  <!-- döner katman çizgileri -->
  <g stroke="#7d2210" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <path d="M42 44 h36"/>
    <path d="M39 56 h42"/>
    <path d="M40 68 h40"/>
    <path d="M42 80 h36"/>
  </g>

  <!-- şiş -->
  <line x1="60" y1="14" x2="60" y2="106" stroke="#f5efe9" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="14" x2="60" y2="106" stroke="#c9beb4" stroke-width="1" stroke-linecap="round"/>
</svg>
